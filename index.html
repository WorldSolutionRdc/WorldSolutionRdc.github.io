<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance en cours</title>
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3a0ca3;
            --accent-color: #f72585;
            --text-light: #f8f9fa;
            --text-dark: #212529;
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-dark);
        }
        
        .maintenance-container {
            max-width: 800px;
            width: 90%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.8s ease-out;
        }
        
        .maintenance-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 2rem;
            text-align: center;
        }
        
        .maintenance-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: pulse 2s infinite;
        }
        
        .maintenance-content {
            padding: 2rem;
            text-align: center;
        }
        
        h1 {
            margin: 0 0 1rem;
            font-weight: 700;
            font-size: 2rem;
        }
        
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            color: #495057;
        }
        
        .progress-container {
            width: 100%;
            background: #e9ecef;
            border-radius: 50px;
            margin: 2rem 0;
            height: 8px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color), #7209b7);
            width: 65%;
            animation: progressAnimation 2s ease-in-out infinite;
        }
        
        .contact-info {
            background: #f8f9fa;
            padding: 1.5rem;
            border-top: 1px solid #e9ecef;
            text-align: center;
        }
        
        .btn {
            display: inline-block;
            background: var(--primary-color);
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }
        
        .btn:hover {
            background: var(--secondary-color);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.3);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        @keyframes progressAnimation {
            0% { width: 65%; }
            50% { width: 70%; }
            100% { width: 65%; }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="maintenance-container">
        <div class="maintenance-header">
            <div class="maintenance-icon">
                <i class="fas fa-tools"></i>
            </div>
            <h1>Maintenance en cours</h1>
        </div>
        
        <div class="maintenance-content">
            <p>Nous améliorons votre expérience. Notre site est actuellement en maintenance et sera de retour très bientôt.</p>
            
            <div class="progress-container">
                <div class="progress-bar"></div>
            </div>
            
            <p>Nous travaillons activement pour terminer les mises à jour au plus vite. Merci pour votre patience.</p>
            
            <a href="mailto:worldsolutiontv@gmail.com" class="btn">Nous contacter</a>
        </div>
        
        <div class="contact-info">
            <p><i class="fas fa-clock"></i> Temps estimé: 2 heures</p>
            <p><i class="fas fa-envelope"></i> worldsolutiontv@gmail.com</p>
        </div>
    </div>
</body>
</html>
